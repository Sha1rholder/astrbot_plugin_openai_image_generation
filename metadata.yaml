name: astrbot_plugin_openai_image_generation
display_name: OpenAI Image Generation
short_desc: Generate WebP images with gpt-image-2.6.
desc: |
  Generate images with OPENAI_API_KEY and gpt-image-2.6. Supports text-to-image and image edits.

  The plugin uses Responses API by default, but also allows Image API. You can instruct agent to use the prefered API.

  OpenAI's built-in web search tool is enabled in Responses API so it can automaticly search for reference images in case it needs.
version: v0.3.0
author: Sha1rholder
repo: https://github.com/Sha1rholder/astrbot_plugin_openai_image_generation
astrbot_version: ">=4.29.4"
social_link: https://sha1.dev
