name: astrbot_plugin_openai_image_generation
display_name: OpenAI Image Generation
short_desc: Let your agent generate WebP via OpenAI Image API.
desc: |
  A super-easy-to-use AstrBot plugin that provides your agent with latest image generation capabilities through OpenAI Image API. It has minimal system prompts, persistent storage of image generation records, and reasonable defaults that agent can override in each session. Supports gpt-image-2.6-sunburst and gpt-image-2.6-flare.

  Requires an OPENAI_API_KEY.
version: v0.1.0
author: Sha1rholder
repo: https://github.com/Sha1rholder/astrbot_plugin_openai_image_generation
astrbot_version: ">=4.29.4"
social_link: https://sha1.dev
tags:
  - OpenAI
  - Image
